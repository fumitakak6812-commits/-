name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/motivation-pwa-app-tdre7i]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。走っているものは走り切らせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages がまだ有効でなければ、ここで有効化される
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # ビルドは無い。リポジトリの中身をそのまま配る。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
